name: Publicar destaque Starlight Concert
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-starlight-20260930.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-starlight-20260930
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inserir a arte original e a legenda aprovada
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import textwrap
          import urllib.request

          root = pathlib.Path('.')
          index = root / 'index.html'
          original = index.read_text(encoding='utf-8')
          anchor = '<section class="section city-section" id="conheca">'
          assert original.count(anchor) == 1, 'Ponto de inserção não encontrado ou ambíguo.'
          assert 'id="starlight-concert"' not in original, 'Evento já presente; interrompendo para evitar duplicação.'
          assert original.count('</head>') == 1
          image_path = root / 'imagens/eventos/starlight-classicos-do-rock-trindade-2026.jpg'
          css_path = root / 'starlight-event.css'
          assert not image_path.exists(), 'Não sobrescrever uma imagem existente.'
          assert not css_path.exists(), 'Não sobrescrever um estilo existente.'

          url = 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/45cbf0cc-8bc4-4023-8a93-3ebcb609b564.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGYyMWU1MmQyNWY3ZmI1NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDkwMDUyNX0.QFjSCpVqWPBToMvy90dcsndZFY339Ej-iDGSvb7H8NE'
          request = urllib.request.Request(url, headers={'User-Agent': 'Portal-Trindade-Publisher/1.0'})
          with urllib.request.urlopen(request, timeout=60) as response:
              image = response.read(2000000)
          expected_hash = '85d9f24a923b17a22572482f2fc1ca3cf7ba64e1a187f48252e6645c2c779142'
          assert hashlib.sha256(image).hexdigest() == expected_hash, 'A imagem transferida difere do original. Publicação interrompida.'
          assert len(image) == 299041 and image.startswith(b'\xff\xd8\xff'), 'Arquivo original JPEG inválido.'

          section = textwrap.dedent('''\
          <!-- Divulgação autorizada: Starlight Concert, 12/11/2026. -->
          <section class="section starlight-event" id="starlight-concert" aria-labelledby="starlight-title">
            <div class="wrap">
              <article class="starlight-card">
                <a class="starlight-art" href="/imagens/eventos/starlight-classicos-do-rock-trindade-2026.jpg" target="_blank" rel="noopener noreferrer" aria-label="Ampliar o cartaz do Starlight Concert em Trindade">
                  <img src="/imagens/eventos/starlight-classicos-do-rock-trindade-2026.jpg" alt="Cartaz do Starlight Concert: Clássicos do Rock à luz de velas em Trindade, em 12 de novembro de 2026, às 20h, no Cine Teatro Aphonsiano" width="1229" height="1536" loading="lazy" decoding="async">
                </a>
                <div class="starlight-copy">
                  <p class="eyebrow">Agenda cultural · Indicação do Portal</p>
                  <h2 id="starlight-title">Clássicos do Rock à luz de velas em Trindade</h2>
                  <p class="starlight-description">O Portal Trindade indica o Starlight Concert, com sucessos do rock reinterpretados ao vivo por um quarteto de cordas à luz de velas. O espetáculo acontece em <strong><time datetime="2026-11-12T20:00:00-03:00">12 de novembro de 2026, às 20h</time></strong>, no <strong>Cine Teatro Aphonsiano</strong>, em Trindade. Classificação livre.</p>
                  <p class="starlight-contact">🎟️ Ingressos e informações: <a href="https://wa.me/551140036119" target="_blank" rel="sponsored noopener noreferrer">WhatsApp (11) 4003-6119</a>, da Ingresso Digital.</p>
                  <a class="btn starlight-cta" href="https://wa.me/551140036119" target="_blank" rel="sponsored noopener noreferrer">Ingressos pelo WhatsApp <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a>
                  <p class="starlight-disclosure">Publicidade | Parceria com Starlight Concert.</p>
                </div>
              </article>
            </div>
          </section>
          ''')
          stylesheet = '<link rel="stylesheet" href="./starlight-event.css?v=20260930-1">'
          updated = original.replace('</head>', stylesheet + '</head>', 1)
          updated = updated.replace(anchor, section + anchor, 1)
          assert updated.replace(section, '', 1).replace(stylesheet, '', 1) == original, 'Alteração fora do escopo.'
          assert updated.count('id="starlight-concert"') == 1

          css = textwrap.dedent('''\
          /* Destaque isolado do evento. A arte original não é cortada nem alterada. */
          .starlight-event{padding:48px 0 12px;scroll-margin-top:110px}
          .starlight-card{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;padding:30px;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:3px;background:var(--paper)}
          .starlight-art{display:block;min-width:0;width:100%;max-width:360px;margin-inline:auto;background:#0b0906;line-height:0}
          .starlight-art img{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}
          .starlight-copy{min-width:0}
          .starlight-copy .eyebrow{font-size:10px;line-height:1.7;letter-spacing:.12em}
          .starlight-copy h2{font-size:clamp(29px,3.1vw,42px);line-height:1.15;margin:16px 0 20px;max-width:600px}
          .starlight-description{font-size:15px;line-height:1.85}
          .starlight-description strong{color:var(--ink);font-weight:650}
          .starlight-contact{font-size:14px;line-height:1.8;margin-top:18px}
          .starlight-contact a{color:var(--blue);font-weight:650;text-decoration:underline;text-underline-offset:3px}
          .starlight-cta{margin-top:22px;min-height:48px}
          .starlight-copy .starlight-disclosure{font-size:12px;line-height:1.7;margin-top:20px;color:var(--muted)}
          @media(max-width:900px) and (min-width:761px){.starlight-card{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);padding:24px;gap:26px}.starlight-copy h2{font-size:30px}.starlight-description{font-size:14px}}
          @media(max-width:760px){.starlight-event{padding:32px 0 8px}.starlight-card{grid-template-columns:minmax(0,1fr);padding:20px;gap:26px}.starlight-copy h2{font-size:32px}.starlight-copy .eyebrow{font-size:9px;letter-spacing:.08em}.starlight-cta{width:100%}}
          @media(max-width:380px){.starlight-card{padding:16px}.starlight-copy h2{font-size:29px}.starlight-description{font-size:14px}}
          ''')
          image_path.parent.mkdir(parents=True, exist_ok=True)
          image_path.write_bytes(image)
          css_path.write_text(css, encoding='utf-8')
          index.write_text(updated, encoding='utf-8')
          report = pathlib.Path('/tmp/starlight-preview')
          report.mkdir(exist_ok=True)
          (report / 'index-before.html').write_text(original, encoding='utf-8')
          (report / 'index-after.html').write_text(updated, encoding='utf-8')
          (report / 'validation.txt').write_text('Original image SHA-256: ' + expected_hash + '\nOriginal image bytes: 299041\nOnly one isolated home-page section and stylesheet reference inserted.\n', encoding='utf-8')
          print('Arte original preservada; seção inserida antes dos guias e da história da cidade.')
          PY
          git diff --check
      - name: Preparar verificação visual
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium > /tmp/starlight-browser-install.log 2>&1
      - name: Validar a imagem inteira e o layout responsivo
        shell: bash
        run: |
          python3 - <<'PY'
          import functools
          import http.server
          import pathlib
          import threading
          from playwright.sync_api import sync_playwright

          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory='.')
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 8765), handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          report = pathlib.Path('/tmp/starlight-preview')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for name, width, height in [('desktop', 1440, 1000), ('tablet', 768, 1024), ('mobile', 390, 844), ('mobile-small', 360, 800)]:
                  page = browser.new_page(viewport={'width': width, 'height': height}, device_scale_factor=1)
                  page.goto('http://127.0.0.1:8765/', wait_until='networkidle')
                  card = page.locator('#starlight-concert .starlight-card')
                  card.scroll_into_view_if_needed()
                  page.wait_for_function("() => {const i=document.querySelector('#starlight-concert img');return i.complete && i.naturalWidth===1229 && i.naturalHeight===1536}")
                  image = page.locator('#starlight-concert img')
                  dimensions = image.bounding_box()
                  assert abs(dimensions['width'] / dimensions['height'] - 1229 / 1536) < 0.005, 'Imagem distorcida.'
                  assert image.evaluate('(i) => getComputedStyle(i).objectFit') == 'contain', 'Imagem não pode ser recortada.'
                  assert page.locator('#starlight-concert .starlight-cta').get_attribute('href') == 'https://wa.me/551140036119'
                  assert page.locator('#starlight-title').inner_text() == 'Clássicos do Rock à luz de velas em Trindade'
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1'), 'Rolagem horizontal detectada.'
                  assert page.locator('#starlight-concert').evaluate('(el) => el.nextElementSibling.id') == 'conheca', 'Posição do destaque incorreta.'
                  card.screenshot(path=str(report / (name + '.png')))
                  with (report / 'validation.txt').open('a', encoding='utf-8') as f:
                      f.write(f'{name}: {width}x{height}, image loaded, no cropping, no horizontal overflow, WhatsApp correct.\n')
                  page.close()
              browser.close()
          server.shutdown()
          PY
      - name: Guardar as verificações visuais
        uses: actions/upload-artifact@v4
        with:
          name: starlight-preview-20260930
          path: /tmp/starlight-preview/
          retention-days: 7
      - name: Publicar somente o destaque e a imagem
        shell: bash
        run: |
          git diff --check
          git add -- index.html starlight-event.css imagens/eventos/starlight-classicos-do-rock-trindade-2026.jpg
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publicar Starlight Concert em destaque na página inicial'
          git push origin HEAD:main
          echo "Commit publicado: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
