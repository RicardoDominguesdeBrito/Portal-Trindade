name: Adicionar capa de Enquanto Houver Manhã

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-enquanto-houver-manha.yml'

permissions:
  contents: write

jobs:
  add-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar capa original da Amazon
        run: |
          set -euo pipefail
          mkdir -p imagens
          curl -fL --retry 3 --retry-delay 2 -A "Mozilla/5.0" \
            "https://m.media-amazon.com/images/I/615jUvHGIoL._SL1499_.jpg" \
            -o imagens/enquanto-houver-manha.jpg
          test -s imagens/enquanto-houver-manha.jpg
          file imagens/enquanto-houver-manha.jpg | grep -Ei "JPEG|image"

      - name: Commit da capa
        run: |
          set -euo pipefail
          git config user.name "Portal Trindade Automation"
          git config user.email "actions@users.noreply.github.com"
          git add imagens/enquanto-houver-manha.jpg
          if git diff --cached --quiet; then
            echo "Capa já estava atualizada."
            exit 0
          fi
          git commit -m "feat: adiciona capa de Enquanto Houver Manhã"
          git push origin main
