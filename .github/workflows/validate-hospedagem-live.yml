name: Validar Portal Trindade

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'portal.css'
      - 'portal.js'
      - 'guias/**'
      - 'hospedagens.json'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/validate-hospedagem-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar navegação, conteúdo estático e base de hospedagem
        run: |
          python3 scripts/validate_site.py
          node --check portal.js
